name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, run all four executable suites, and publish
        run: ./tools/Build.ps1
      # Native UI regression requires an interactive Windows desktop; run locally.
      - name: Save framework-dependent Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: Amifolio-win-x64
          path: |
            artifacts/Amifolio/
            !artifacts/Amifolio/**/*.pdb
          if-no-files-found: error
          retention-days: 14
