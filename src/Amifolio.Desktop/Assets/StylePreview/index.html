<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>风格预览</title>
  <link rel="stylesheet" href="./preview.css">
  <script defer src="./preview.js"></script>
</head>
<body>
  <main class="workspace">
    <article class="canvas" id="canvas" aria-label="可编辑风格样张">
      <header class="sheet-header">
        <span id="scope-name">风格示例</span>
        <button class="preview-trigger background-trigger" type="button" data-editor="background-editor"
                aria-expanded="false" aria-controls="background-editor" disabled>
          <span class="swatch" aria-hidden="true"></span>背景
        </button>
      </header>

      <div class="sheet-content">
        <div class="intro">
          <h1>
            <button class="preview-trigger title-trigger" type="button" data-editor="title-editor"
                    aria-expanded="false" aria-controls="title-editor" aria-describedby="font-note" disabled>
              <span class="title-english" lang="en">Sea<br>&amp; daylight</span>
              <span class="title-chinese">海风与白昼</span>
              <span class="visually-hidden">，编辑标题字体</span>
            </button>
          </h1>

          <button class="preview-trigger body-trigger" type="button" data-editor="body-editor" aria-expanded="false"
                  aria-controls="body-editor" aria-label="编辑样文和语气" aria-describedby="sample voice-note" disabled>
            <span id="sample">潮水退下去，石头慢慢发亮。</span>
            <span class="voice-note" id="voice-note" hidden></span>
          </button>

          <button class="preview-trigger action-trigger" type="button" data-editor="action-editor" aria-expanded="false"
                  aria-controls="action-editor" aria-label="读随笔，编辑主色和圆角" disabled>
            读随笔 <span aria-hidden="true">↗</span>
          </button>
        </div>

        <button class="preview-trigger work-card" type="button" data-editor="work-editor" aria-expanded="false"
                aria-controls="work-editor" aria-label="散步手记，编辑作品卡的留白和风格"
                aria-describedby="work-style" disabled>
          <span class="cover" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>散步手记 <span aria-hidden="true">↗</span></strong>
            <span id="work-style">封面设计</span>
          </span>
        </button>
      </div>
    </article>

    <aside class="inspector" aria-labelledby="inspector-title">
      <h2 id="inspector-title">编辑样张</h2>
      <p id="preview-hint">点选样张元素，或在这里选择。</p>
      <div class="editor-picks" role="group" aria-label="编辑项">
        <button type="button" data-pick="title-editor" aria-pressed="false" aria-controls="title-editor" disabled>标题</button>
        <button type="button" data-pick="background-editor" aria-pressed="false" aria-controls="background-editor" disabled>背景</button>
        <button type="button" data-pick="body-editor" aria-pressed="false" aria-controls="body-editor" disabled>正文</button>
        <button type="button" data-pick="action-editor" aria-pressed="false" aria-controls="action-editor" disabled>按钮</button>
        <button type="button" data-pick="work-editor" aria-pressed="false" aria-controls="work-editor" disabled>作品卡</button>
      </div>

      <fieldset class="editor" id="title-editor" hidden>
        <legend>标题字体</legend>
        <label for="font">本机字体</label>
        <select id="font" data-field="font" aria-describedby="font-note"></select>
        <p class="field-note" id="font-note" role="status" hidden></p>
      </fieldset>

      <fieldset class="editor" id="background-editor" hidden>
        <legend>页面背景</legend>
        <label for="background">背景色</label>
        <div class="color-controls">
          <input type="color" id="background" data-field="background" value="#24766d">
          <input type="text" id="background-hex" aria-label="背景色十六进制色值" aria-describedby="background-hint"
                 maxlength="7" autocomplete="off" spellcheck="false" placeholder="#24766D">
          <button class="reset" type="button" data-clear="background">用主题默认</button>
        </div>
        <p class="field-note" id="background-hint" hidden role="status">请输入 #RRGGBB 色值。</p>
        <div class="background-presets" role="group" aria-label="背景色预设">
          <button type="button" data-background-preset="#24766D">松石绿</button>
          <button type="button" data-background-preset="#536446">苔绿</button>
        </div>
      </fieldset>

      <fieldset class="editor" id="body-editor" hidden>
        <legend>正文与语气</legend>
        <label for="sample-text">样文</label>
        <textarea id="sample-text" rows="4" maxlength="500" data-field="sampleText"
                  placeholder="潮水退下去，石头慢慢发亮。"></textarea>
        <label for="voice">文字语气</label>
        <input type="text" id="voice" maxlength="240" data-field="voice" placeholder="例如轻松、自然">
      </fieldset>

      <fieldset class="editor" id="action-editor" hidden>
        <legend>按钮外观</legend>
        <label for="color">主色</label>
        <div class="color-controls">
          <input type="color" id="color" data-field="color" value="#174d43">
          <input type="text" id="color-hex" aria-label="主色十六进制色值" aria-describedby="color-hint"
                 maxlength="7" autocomplete="off" spellcheck="false" placeholder="#174D43">
          <button class="reset" type="button" data-clear="color">用主题默认</button>
        </div>
        <p class="field-note" id="color-hint" hidden role="status">请输入 #RRGGBB 色值。</p>
        <div class="range-controls">
          <label for="radius">圆角</label>
          <output for="radius" id="radius-value"></output>
          <input type="range" id="radius" data-field="radius" min="0" max="48" value="16">
          <button class="reset" type="button" data-clear="radius">用主题默认</button>
        </div>
      </fieldset>

      <fieldset class="editor" id="work-editor" hidden>
        <legend>作品卡</legend>
        <div class="range-controls">
          <label for="spacing">留白</label>
          <output for="spacing" id="spacing-value"></output>
          <input type="range" id="spacing" data-field="spacing" min="0" max="64" value="24">
          <button class="reset" type="button" data-clear="spacing">用主题默认</button>
        </div>
        <label for="style">创作风格</label>
        <input type="text" id="style" maxlength="240" data-field="style" placeholder="封面设计">
      </fieldset>
    </aside>
  </main>
</body>
</html>
